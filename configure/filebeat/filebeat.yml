filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/log/nginx/access.log
    fields:
      log_type: nginx_access
      server: app-server-1
    fields_under_root: true

  - type: log
    enabled: true
    paths:
      - /var/log/nginx/error.log
    fields:
      log_type: nginx_error
      server: app-server-1
    fields_under_root: true

output.logstash:
  hosts: ["ELK_PRIVATE_IP:5044"]